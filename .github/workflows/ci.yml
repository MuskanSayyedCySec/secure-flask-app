name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Scan code with Bandit
        run: bandit -r . -x ./.venv,./tests

      - name: Check packages with pip-audit
        run: pip-audit -r requirements.txt

  build:
    name: Build and check image
    needs: [test, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t flask-app:ci .

      - name: Check the image does not run as root
        run: |
          uid=$(docker run --rm flask-app:ci id -u)
          echo "Container runs as UID $uid"
          test "$uid" = "10001"

      - name: Check pip is not in the image
        run: |
          if docker run --rm flask-app:ci pip --version; then
            echo "pip was found in the image"
            exit 1
          fi
          echo "pip is not in the image"
          
      - name: Install Trivy and verify its hash
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy

      - name: Report all image vulnerabilities
        run: trivy image --scanners vuln --exit-code 0 flask-app:ci

      - name: Block fixable high and critical vulnerabilities
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 flask-app:ci

      - name: Block high and critical Dockerfile problems
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --skip-files Dockerfile.insecure .

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks and verify its hash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan full history for secrets
        run: gitleaks git -v .